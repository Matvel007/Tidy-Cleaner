[package]
name = "cleaner"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.9"
tokio = { version = "1.40", features = ["full"] }
sysinfo = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.37", features = ["serialize"] }
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"

[build-dependencies]
slint-build = "1.9"
